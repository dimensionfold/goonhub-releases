# Installed as .github/workflows/publish.yml in dimensionfold/goonhub-releases.
name: Publish staged app release
on:
  push:
    branches: ['incoming/**']
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble large installers
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('payload')
          transport = p / 'transport.json'
          if transport.exists():
              manifest = json.loads((p / 'update.json').read_text())
              metadata = json.loads(transport.read_text())
              assert metadata['schemaVersion'] == 1 and len(metadata['files']) == 1
              record = metadata['files'][0]
              expected = manifest['artifacts']['windows']
              name = expected['url'].rsplit('/', 1)[1]
              assert name == 'goonhub-' + manifest['versionName'] + '-windows-installer.exe'
              assert record['name'] == name and record['size'] == expected['size']
              assert record['sha256'] == expected['sha256'] and 0 < record['size'] <= 2 * 1024**3
              assert 0 < record['chunkSize'] <= 48 * 1024**2
              assert 0 < len(record['parts']) <= 64
              assert len(record['parts']) == (record['size'] + record['chunkSize'] - 1) // record['chunkSize']
              digest = hashlib.sha256()
              size = 0
              with (p / name).open('wb') as output:
                  for index, part in enumerate(record['parts']):
                      assert part == name + '.part' + str(index).zfill(4)
                      chunk = (p / part).read_bytes()
                      assert 0 < len(chunk) <= record['chunkSize']
                      output.write(chunk)
                      digest.update(chunk)
                      size += len(chunk)
              assert size == expected['size'] and digest.hexdigest() == expected['sha256']
              for part in record['parts']:
                  (p / part).unlink()
              transport.unlink()
          PY
      - name: Validate complete payload
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('payload')
          m = json.loads((p / 'update.json').read_text())
          assert m['schemaVersion'] == 1 and m['versionCode'] > 0
          assert m['packageName'] == 'cum.goon.goonhub'
          assert set(m['artifacts']) in ({'foss', 'cast'}, {'foss', 'cast', 'windows'})
          for a in m['artifacts'].values():
              data = (p / a['url'].rsplit('/', 1)[1]).read_bytes()
              assert len(data) == a['size'] and hashlib.sha256(data).hexdigest() == a['sha256']
          assert (p / m['sourceUrl'].rsplit('/', 1)[1]).is_file()
          with open('release.env', 'w') as f:
              f.write('VERSION=' + m['versionName'] + '\n')
          PY
          cat release.env >> "$GITHUB_ENV"
      - name: Upload draft then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            echo "Release already published; preserving its immutable assets."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "Goonhub $VERSION" --notes-file payload/release-notes.md
          fi
          shopt -s nullglob
          assets=(payload/*.apk payload/*.exe payload/*-source.tar.gz payload/update.json)
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --latest --notes-file payload/release-notes.md
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
